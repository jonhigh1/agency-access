name: Application quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/authhub_test
      # Structurally valid placeholder for static builds, never a live Clerk instance.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate shared contracts
        run: npm run build --workspace=packages/shared
      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api
      - name: Check types in every workspace
        run: npm run typecheck
      - name: Run deterministic tests
        run: npm run test:run
      - name: Lint application code
        run: npm run lint
      - name: Build application and CLI
        run: npm run build && npm run build --workspace=tools/authhub-cli
